components:
  schemas:
    #   Common objects
    UnitOfMeasuresRequest:
      description: Units of measures for filtering data
      nullable: true
      type: array
      items:
        type: string
      example:
        - "t"
        - "kwh"
        - "%"
    CurrencyRequest:
      nullable: true
      type: string
      enum: [ USD, CNY, JPY, AUD, KRW, EUR ]
      example: CNY
    UnitRequest:
      description: Drive on which data must be returned
      nullable: true
      type: string
      enum: [ t, kg, lb ]
      example: t
    Category:
      type: object
      properties:
        id:
          type: string
          example: 788353e5-3d01-4836-a333-9da2dc06141c
        name:
          type: string
          example: Lithium Carbonate
        alias:
          nullable: true
          type: string
          example: null
        chemicalCode:
          type: string
          example: LC
        isSustainable:
          type: boolean
          example: false
    Purity:
      type: object
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e7b
        name:
          type: string
          example: Min 99.0%
    ShippingRoute:
      type: object
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e1b
