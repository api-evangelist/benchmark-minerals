          example: 1000
        last:
          nullable: true
          type: number
          example: 1100
        latestChange:
          nullable: true
          type: object
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        dailyChange:
          description: Daily percentage change of the current value compared to the value from the previous day.
          nullable: true
          type: object
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        weeklyChange:
          description: Weekly percentage change of the current value compared to the value from the previous week.
          nullable: true
          type: object
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
