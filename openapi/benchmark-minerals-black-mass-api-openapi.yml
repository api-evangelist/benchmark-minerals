openapi: 3.2.0
info:
  title: Benchmark Mineral Intelligence Black Mass API
  version: '2.0'
  description: The Benchmark API provides access to a comprehensive range of pricing data for various markets to empower your most critical energy transition decisions.
servers:
- url: http://localhost:3013/v2
- url: https://{environment}.benchmarkminerals.com/{version}
  variables:
    environment:
      enum:
      - api
      - dev-api
      - qa-api
      default: api
    version:
      enum:
      - v2
      default: v2
tags:
- name: Black Mass
paths:
  /prices/black-mass:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlackMassFindAllPricesRequest'
        required: true
      tags:
      - Black Mass
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlackMassPricesApiResponse'
          description: Successful operation
      operationId: black-mass-list-prices
      description: List prices
      security:
      - api_key:
        - black-mass:read
        - prices:black-mass
      summary: Black mass list prices
      x-summary-source: derived
  /prices/black-mass/summary:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlackMassFindSummaryPricesRequest'
      tags:
      - Black Mass
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlackMassPricesSummaryApiResponse'
          description: Successful operation
        '401':
          description: unauthorized
      security:
      - api_key:
        - black-mass:read
        - prices:black-mass
      operationId: black-mass-summary
      summary: Summary
  /prices/black-mass/index:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlackMassIndexDTO'
        required: false
      tags:
      - Black Mass
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexApiResponseV2'
          description: Successful operation
        '401':
          description: unauthorized
      security:
      - api_key:
        - black-mass:read
        - prices:black-mass
      operationId: black-mass-index
      summary: Index
components:
  schemas:
    UnitOfMeasure:
      type: object
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e1b
        name:
          type: string
          example: Tonne
        symbol:
          type:
          - string
          - 'null'
          example: t
    ShippingRoute:
      type: object
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e1b
        name:
          type: string
          example: CIF Asia
        alias:
          type:
          - string
          - 'null'
          example: CIF Asia (Combined)
    BlackMassFeedstocks:
      description: feedstocks in the store
      type: array
      items:
        type: string
      example:
      - LFP
      - LCO
      - All Chemistries
      - NCM
    Category:
      type: object
      properties:
        id:
          type: string
          example: 788353e5-3d01-4836-a333-9da2dc06141c
        name:
          type: string
          example: Lithium Carbonate
        alias:
          type:
          - string
          - 'null'
          example: null
        chemicalCode:
          type: string
          example: LC
        isSustainable:
          type: boolean
          example: false
    DataSummary:
      type: object
      properties:
        today:
          type:
          - number
          - 'null'
          example: 1000
        last:
          type:
          - number
          - 'null'
          example: 1100
        latestChange:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        dailyChange:
          description: Daily percentage change of the current value compared to the value from the previous day.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        weeklyChange:
          description: Weekly percentage change of the current value compared to the value from the previous week.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        biWeeklyChange:
          description: Bi-weekly percentage change of the current value compared to the value from two weeks ago.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        monthlyChange:
          description: Monthly percentage change of the current value compared to the value from the previous month.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        quarterlyMonthsChange:
          description: Quarterly percentage change of the current value compared to the value from three months ago.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        sixMonthsChange:
          description: Semi-annual percentage change of the current value compared to the value from six months ago.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        yearOnYear:
          description: Year-on-year percentage change of the current value compared to the value from the same period last year.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        yearToDate:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
    PriceType:
      type: object
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e7b
        name:
          type: string
          example: Price
        order:
          type: number
          example: 3
    BlackMassPricesSummaryApiResponse:
      type: object
      properties:
        $metadata:
          type: object
          properties:
            product:
              type: string
              example: Black Mass
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: 5c7f2d17-cae5-47f9-8e2f-abd141970e1b
              name:
                type: string
                example: test
              alias:
                type:
                - string
                - 'null'
                example: null
              chemicalCode:
                type:
                - string
                - 'null'
                example: LC
              frequency:
                type: string
                example: monthly
              isSustainable:
                type: boolean
                example: false
              series:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the grade
                    shippingRoute:
                      $ref: '#/components/schemas/ShippingRoute'
                    product:
                      $ref: '#/components/schemas/BlackMassProduct'
                    unitOfMeasure:
                      $ref: '#/components/schemas/UnitOfMeasure'
                    currency:
                      $ref: '#/components/schemas/Currency'
                    priceType:
                      $ref: '#/components/schemas/PriceType'
                    data:
                      $ref: '#/components/schemas/DataSummary'
    BlackMassPricesApiResponse:
      type: object
      properties:
        $metadata:
          type: object
          properties:
            product:
              type: string
              example: Black Mass
        data:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the grade
              feedstock:
                $ref: '#/components/schemas/Category'
              product:
                $ref: '#/components/schemas/BlackMassProduct'
              shippingRoutes:
                $ref: '#/components/schemas/ShippingRoute'
              unitOfMeasure:
                $ref: '#/components/schemas/UnitOfMeasure'
              currency:
                $ref: '#/components/schemas/Currency'
              priceType:
                $ref: '#/components/schemas/PriceType'
              series:
                type: array
                items:
                  $ref: '#/components/schemas/Series'
    BlackMassFindSummaryPricesRequest:
      type: object
      properties:
        feedstocks:
          $ref: '#/components/schemas/BlackMassFeedstocks'
        products:
          $ref: '#/components/schemas/BlackMassProducts'
        shippingRoutes:
          $ref: '#/components/schemas/BlackMassRoutes'
        priceTypes:
          description: Price type
          type: array
          items:
            type: string
          example:
          - Payable
          - Weighted Average Price
          - Fixed Price
        unitOfMeasures:
          $ref: '#/components/schemas/UnitOfMeasuresRequest'
        currency:
          $ref: '#/components/schemas/CurrencyRequest'
        unit:
          $ref: '#/components/schemas/UnitRequest'
    BlackMassRoutes:
      description: routes in the store
      type: array
      items:
        type: string
      example:
      - EXW North America
      - EXW China
      - CIF Asia
    BlackMassIndexDTO:
      type:
      - object
      - 'null'
      properties:
        from:
          format: yyyy-MM-dd
          type: string
          example: 2023-01-31
        to:
          format: yyyy-MM-dd
          type: string
          example: 2023-01-31
        indexes:
          description: indexes in the store
          type:
          - array
          - 'null'
          items:
            type: string
          example:
          - Black Mass
    BlackMassFindAllPricesRequest:
      required:
      - from
      - to
      type: object
      properties:
        from:
          format: yyyy-MM-dd
          type: string
          example: 2023-01-31
        to:
          format: yyyy-MM-dd
          type: string
          example: 2023-01-31
        feedstocks:
          $ref: '#/components/schemas/BlackMassFeedstocks'
        products:
          $ref: '#/components/schemas/BlackMassProducts'
        shippingRoutes:
          $ref: '#/components/schemas/BlackMassRoutes'
        priceTypes:
          description: Price type
          type: array
          items:
            type: string
          example:
          - Payable
          - Weighted Average Price
          - Fixed Price
        unitOfMeasures:
          $ref: '#/components/schemas/UnitOfMeasuresRequest'
        currency:
          $ref: '#/components/schemas/CurrencyRequest'
        unit:
          $ref: '#/components/schemas/UnitRequest'
    BlackMassProducts:
      description: types in the store
      type: array
      items:
        type: string
      example:
      - All Scrap
      - Co
      - CoSO4
      - EOL
      - LCE
      - Li Price per Percentage Point
      - Ni
      - NiSO4
      - Process Scrap
    BlackMassProduct:
      type: object
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e7b
        name:
          type: string
          example: EOL
        alias:
          type:
          - string
          - 'null'
          example: End of Life
    UnitRequest:
      description: Drive on which data must be returned
      type:
      - string
      - 'null'
      enum:
      - t
      - kg
      - lb
      example: t
    IndexApiResponseV2:
      type: object
      properties:
        $metadata:
          type: object
          properties:
            product:
              type: string
              example: test
        data:
          type: object
          properties:
            summary:
              type: array
              items:
                type: object
                properties:
                  product:
                    type: string
                    example: test
                  updateFrequency:
                    type: string
                    example: monthly
                  order:
                    type: number
                    example: 1
                  data:
                    $ref: '#/components/schemas/DataSummaryIndex'
            detail:
              type: array
              items:
                type: object
                properties:
                  product:
                    type: string
                    example: test
                  order:
                    type: number
                    example: 1
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          format: yyyy-MM-dd
                          type: string
                          example: 2023-01-31
                        value:
                          type: number
                          example: 435.21
    UnitOfMeasuresRequest:
      description: Units of measures for filtering data
      type:
      - array
      - 'null'
      items:
        type: string
      example:
      - t
      - kwh
      - '%'
    Currency:
      type:
      - object
      - 'null'
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e1b
        name:
          type: string
          example: Dollar
        iso:
          type: string
          example: USD
        symbol:
          type: string
          example: $
    CurrencyRequest:
      type:
      - string
      - 'null'
      enum:
      - USD
      - CNY
      - JPY
      - AUD
      - KRW
      - EUR
      example: CNY
    Series:
      type: object
      properties:
        date:
          format: yyyy-MM-dd
          type: string
          example: 2023-01-31
        valueLow:
          type:
          - number
          - 'null'
          example: 1000
        valueHigh:
          type:
          - number
          - 'null'
          example: 2000
        valueMid:
          type: number
          example: 3000
    DataSummaryIndex:
      type: object
      properties:
        today:
          type:
          - number
          - 'null'
          example: 1000
        last:
          type:
          - number
          - 'null'
          example: 1100
        latestChange:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        yearOnYear:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        yearToDate:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
