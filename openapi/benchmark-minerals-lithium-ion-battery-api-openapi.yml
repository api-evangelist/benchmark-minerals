openapi: 3.2.0
info:
  title: Benchmark Mineral Intelligence Lithium ion Battery API
  version: '2.0'
  description: The Benchmark API provides access to a comprehensive range of pricing data for various markets to empower your most critical energy transition decisions.
servers:
- url: http://localhost:3013/v2
- url: https://{environment}.benchmarkminerals.com/{version}
  variables:
    environment:
      enum:
      - api
      - dev-api
      - qa-api
      default: api
    version:
      enum:
      - v2
      default: v2
tags:
- name: Lithium ion Battery
paths:
  /prices/lithium-ion-battery:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LithiumIonBatteryFindAllPricesDTO'
        required: true
      tags:
      - Lithium ion Battery
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LithiumIonBatteryPricesApiResponse'
          description: Successful operation
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRequestError'
          description: Bad request
        '401':
          description: unauthorized
      security:
      - api_key:
        - lithium-ion-battery:read
        - prices:lithium-ion-batteries
      operationId: lithium-ion-battery-list-prices
      summary: List prices
      description: 'List the prices with the possibility to filter the result by:

        - Range of dates

        - Category

        - Mesh size

        - Format

        - Shipping region

        - Price Type'
  /prices/lithium-ion-battery/summary:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LithiumIonBatterySummaryDTO'
        required: true
      tags:
      - Lithium ion Battery
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LithiumIonBatteryPricesSummaryApiResponse'
          description: Successful operation
        '401':
          description: unauthorized
      security:
      - api_key:
        - lithium-ion-battery:read
        - prices:lithium-ion-batteries
      operationId: lithium-ion-battery-summary
      summary: Summary
  /prices/lithium-ion-battery/index:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LithiumIonBatteryIndexDTO'
        required: false
      tags:
      - Lithium ion Battery
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LithiumIonBatteryIndexApiResponse'
          description: Successful operation
        '401':
          description: unauthorized
      security:
      - api_key:
        - lithium-ion-battery:read
        - prices:lithium-ion-batteries
      operationId: lithium-ion-battery-index
      summary: Index
components:
  schemas:
    UnitOfMeasure:
      type: object
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e1b
        name:
          type: string
          example: Tonne
        symbol:
          type:
          - string
          - 'null'
          example: t
    CurrencyRequest:
      type:
      - string
      - 'null'
      enum:
      - USD
      - CNY
      - JPY
      - AUD
      - KRW
      - EUR
      example: CNY
    Format:
      type:
      - object
      - 'null'
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e7b
        name:
          type: string
          example: Pouch
    LithiumIonBatteryFindAllPricesDTO:
      required:
      - from
      - to
      type: object
      properties:
        from:
          format: yyyy-MM-dd
          type: string
          example: 2023-01-01
        to:
          format: yyyy-MM-dd
          type: string
          example: 2023-01-31
        currency:
          $ref: '#/components/schemas/CurrencyRequest'
        categories:
          description: categories in the store
          type: array
          items:
            type: string
          example:
          - NCM
          - Lithium ion Battery
          - EV
          - NCM111
          - NCM523
          - NCM622
          - NCM811
          - NCA
          - LFP
          - LCO
        formats:
          description: formats in the store
          type: array
          items:
            type: string
          example:
          - Cylindrical
          - Prismatic
          - Pouch
        shippingRoutes:
          description: regions in the store
          type: array
          items:
            type: string
          example:
          - EXW China
          - EXW North America
          - EXW Europe
          - EXW Asia
        priceTypes:
          description: Price type
          type: array
          items:
            type: string
          example:
          - Price
          - Global Weighted Average
        unitOfMeasures:
          $ref: '#/components/schemas/UnitOfMeasuresRequest'
    LithiumIonBatteryPricesSummaryApiResponse:
      type: object
      properties:
        $metadata:
          $ref: '#/components/schemas/ProductMetadata'
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: 5c7f2d17-cae5-47f9-8e2f-abd141970e1b
              name:
                type: string
                example: LCO
              alias:
                type:
                - string
                - 'null'
                example: null
              chemicalCode:
                type:
                - string
                - 'null'
                example: null
              frequency:
                type: string
                example: monthly
              isSustainable:
                type: boolean
                example: false
              series:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the grade
                    shippingRoute:
                      $ref: '#/components/schemas/LithiumIonBatteryCellShippingRoute'
                    format:
                      $ref: '#/components/schemas/Format'
                    capacity:
                      $ref: '#/components/schemas/Capacity'
                    unitOfMeasure:
                      $ref: '#/components/schemas/UnitOfMeasure'
                    currency:
                      $ref: '#/components/schemas/Currency'
                    priceType:
                      $ref: '#/components/schemas/PriceType'
                    data:
                      $ref: '#/components/schemas/DataSummary'
    Category:
      type: object
      properties:
        id:
          type: string
          example: 788353e5-3d01-4836-a333-9da2dc06141c
        name:
          type: string
          example: Lithium Carbonate
        alias:
          type:
          - string
          - 'null'
          example: null
        chemicalCode:
          type: string
          example: LC
        isSustainable:
          type: boolean
          example: false
    LithiumIonBatteryIndexApiResponse:
      type: object
      properties:
        $metadata:
          $ref: '#/components/schemas/ProductMetadata'
        data:
          type: object
          properties:
            summary:
              type: array
              items:
                type: object
                properties:
                  product:
                    type: string
                    example: Battery Cell
                  updateFrequency:
                    type: string
                    example: monthly
                  order:
                    type: number
                    example: 1
                  data:
                    $ref: '#/components/schemas/DataSummaryIndex'
            detail:
              type: array
              items:
                type: object
                properties:
                  product:
                    type: string
                    example: Battery Cell
                  order:
                    type: number
                    example: 1
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          format: yyyy-MM-dd
                          type: string
                          example: 2023-01-31
                        value:
                          type: number
                          example: 435.21
    LithiumIonBatteryCellShippingRoute:
      type:
      - object
      - 'null'
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e1b
        name:
          type: string
          example: EXW Asia
        alias:
          type:
          - string
          - 'null'
    Capacity:
      type:
      - object
      - 'null'
      properties:
        id:
          type: string
          example: e3f4a5b6-c7d8-4e9f-a0b1-c2d3e4f5a6b7
        name:
          type: string
          example: 100-150 Ah
    DataSummary:
      type: object
      properties:
        today:
          type:
          - number
          - 'null'
          example: 1000
        last:
          type:
          - number
          - 'null'
          example: 1100
        latestChange:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        dailyChange:
          description: Daily percentage change of the current value compared to the value from the previous day.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        weeklyChange:
          description: Weekly percentage change of the current value compared to the value from the previous week.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        biWeeklyChange:
          description: Bi-weekly percentage change of the current value compared to the value from two weeks ago.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        monthlyChange:
          description: Monthly percentage change of the current value compared to the value from the previous month.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        quarterlyMonthsChange:
          description: Quarterly percentage change of the current value compared to the value from three months ago.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        sixMonthsChange:
          description: Semi-annual percentage change of the current value compared to the value from six months ago.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        yearOnYear:
          description: Year-on-year percentage change of the current value compared to the value from the same period last year.
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        yearToDate:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
    PriceType:
      type: object
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e7b
        name:
          type: string
          example: Price
        order:
          type: number
          example: 3
    ProductMetadata:
      type: object
      properties:
        product:
          type: string
          example: Lithium ion Battery Cell
    LithiumIonBatteryPricesApiResponse:
      type: object
      properties:
        $metadata:
          $ref: '#/components/schemas/ProductMetadata'
        data:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the grade
              category:
                $ref: '#/components/schemas/Category'
              format:
                $ref: '#/components/schemas/Format'
              capacity:
                $ref: '#/components/schemas/Capacity'
              shippingRoute:
                $ref: '#/components/schemas/LithiumIonBatteryCellShippingRoute'
              unitOfMeasure:
                $ref: '#/components/schemas/UnitOfMeasure'
              currency:
                $ref: '#/components/schemas/Currency'
              priceType:
                $ref: '#/components/schemas/PriceType'
              series:
                type: array
                items:
                  $ref: '#/components/schemas/Series'
    LithiumIonBatteryIndexDTO:
      type:
      - object
      - 'null'
      properties:
        from:
          format: yyyy-MM-dd
          type: string
          example: 2023-01-31
        to:
          format: yyyy-MM-dd
          type: string
          example: 2023-01-31
        indexes:
          description: indexes in the store
          type: array
          items:
            type: string
          example:
          - Battery Cell
    UnitOfMeasuresRequest:
      description: Units of measures for filtering data
      type:
      - array
      - 'null'
      items:
        type: string
      example:
      - t
      - kwh
      - '%'
    ValidationRequestError:
      type: array
      items:
        type: object
        properties:
          type:
            type: string
            example: field
          msg:
            type: string
            example: Field from is required
          path:
            type: string
            example: from
          location:
            type: string
            example: body
    Currency:
      type:
      - object
      - 'null'
      properties:
        id:
          type: string
          example: 5c7f2d17-cae5-47f9-8e2f-abd141970e1b
        name:
          type: string
          example: Dollar
        iso:
          type: string
          example: USD
        symbol:
          type: string
          example: $
    LithiumIonBatterySummaryDTO:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyRequest'
        categories:
          description: categories in the store
          type: array
          items:
            type: string
          example:
          - NCM
          - Lithium ion Battery
          - EV
          - NCM111
          - NCM523
          - NCM622
          - NCM811
          - NCA
          - LFP
          - LCO
        formats:
          description: purities in the store
          type: array
          items:
            type: string
          example:
          - Cylindrical
          - Prismatic
          - Pouch
        shippingRoutes:
          description: regions in the store
          type: array
          items:
            type: string
          example:
          - EXW China
          - EXW North America
          - EXW Europe
          - EXW Asia
        priceTypes:
          description: Price type
          type: array
          items:
            type: string
          example:
          - Price
          - Global Weighted Average
        unitOfMeasures:
          $ref: '#/components/schemas/UnitOfMeasuresRequest'
    Series:
      type: object
      properties:
        date:
          format: yyyy-MM-dd
          type: string
          example: 2023-01-31
        valueLow:
          type:
          - number
          - 'null'
          example: 1000
        valueHigh:
          type:
          - number
          - 'null'
          example: 2000
        valueMid:
          type: number
          example: 3000
    DataSummaryIndex:
      type: object
      properties:
        today:
          type:
          - number
          - 'null'
          example: 1000
        last:
          type:
          - number
          - 'null'
          example: 1100
        latestChange:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        yearOnYear:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
        yearToDate:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              example: -5
            unit:
              type: string
              example: '%'
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
