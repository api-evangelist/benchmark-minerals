specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Benchmark Minerals
providerId: benchmark-minerals
generated: '2026-09-04'
method: searched
source: https://www.benchmarkminerals.com/prices-api.yml (info.description) + https://www.benchmarkminerals.com/api
created: '2026-05-04'
modified: '2026-09-04'
supersedes: The 2026-05-04 bulk-sweep scaffold, which published invented numbers — 10/100/1000 rpm tiers,
  1,000 and 100,000 monthly quotas, and X-RateLimit-* headers Benchmark has never documented. Benchmark
  publishes no rate-limit numbers at all; that honest zero replaces the invented ladder.
description: Benchmark applies rate limiting but publishes neither the limits nor the runtime signal.
  The limits are contractual and per-customer, not documented.
limit_count: 0
limits: []
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  documented: false
  note: No rate-limit response header is documented in the OpenAPI or on the API pages, so an agent has
    no runtime signal to back off on.
responseCodes:
  throttled: null
  documented: false
  note: 'No 429 response is declared on any of the 36 operations in the contract. The published consequence
    of exceeding limits is account-level, not a status code: "exceeding the defined rate limits may result
    in temporary suspension of access".'
published_statement: 'info.description: "Rate limiting is applied to manage the number of requests a client
  can make within a defined period. The specific rate limits can be configured based on your business
  requirements to ensure fair usage and avoid abuse."'
model: per-contract, negotiated — not published
gaps:
- issue: no numeric limit published
  impact: capacity planning requires a sales conversation
- issue: no RateLimit-* or Retry-After headers
  impact: clients cannot implement adaptive backoff; they can only retry blind
- issue: no 429 in the contract
  impact: throttling is invisible to a generated client
