info:
  title: API Evangelist enhancements — Benchmark Mineral Intelligence Prices API
  version: 1.0.0
  x-generated: '2026-09-04'
  x-method: generated
  x-source: openapi/benchmark-minerals-prices-api.yml
  x-note: 'Non-destructive enhancements over the provider contract. The original spec in openapi/_original/
    is never mutated. These actions record what is missing rather than changing behaviour: contact and
    terms, a warning on the internal localhost server, tag definitions for the 14 markets, key-provisioning
    prose on the security scheme, a document-level security requirement, and summaries for the three operations
    that ship without one (nickel-list-prices, black-mass-list-prices, rare-earths-list-prices).'
extends: https://www.benchmarkminerals.com/prices-api.yml
