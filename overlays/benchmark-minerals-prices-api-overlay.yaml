    termsOfService: https://www.benchmarkminerals.com/terms
- target: $.servers[?(@.url=='http://localhost:3013/v2')]
  description: Flag the internal localhost server that ships as servers[0] in the published contract;
    a naive generated client takes servers[0] and targets the developer machine.
