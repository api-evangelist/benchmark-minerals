    surface: MCP gateway
    endpoint: https://mcp.benchmarkminerals.com/mcp
    issuer: https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_GuiZRnNNK
  see: authentication/benchmark-minerals-authentication.yml
idempotency:
  coverage: na
  mutating_operations: 0
  header: null
  scope: []
  note: 'No replay protection mechanism is documented, and none is needed: the contract declares zero
    state-changing operations. All 36 POSTs are query operations that return price data. Recorded as `na`
    rather than `none` so an honest absence of a write surface is not scored as a missing safeguard.'
reversibility:
  grade: na
  mutating_operations: 0
  reversal_operations: []
  note: The API is read-only, so there is nothing to reverse. No cancel/refund/void/undo/restore operation
    exists in the contract and none should. Windows are deliberately not asserted.
dry_run_mode:
  supported: na
  note: Read-only surface; a rehearsal mode has no meaning here.
pagination:
  style: none
  note: No limit/offset/cursor/page parameter exists in any request schema and no nextPage/total field
    exists in any response schema. Result size is bounded by the caller supplied `from`/`to` date window
    and the categories/purities/shippingRoutes/priceTypes filter arrays instead. An agent pulling a long
    history has no server-side paging to lean on and must window by date itself.
filtering:
