surface_shape:
  style: RPC-over-POST
  note: 'Every one of the 36 operations is a POST that carries a filter object in the request body and
    returns data. There are no GET operations and no path or query parameters anywhere in the contract,
    so the API is semantically read-only while being syntactically all-POST. This matters for agents:
    POST is normally the unsafe verb, but here no operation changes provider state.'
authentication:
  style: api-key-header
